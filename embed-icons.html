<!--
  Google Sites embed box ratio: width:height = 11:6 (height = 6/11 × width).
  66 icons, 11 columns by 6 rows. Icon size is in rem (--u), so the grid

-->

    padding: 1.15rem;
    justify-content: center;

  .icon-btn {

    justify-content: center;
    border-radius: 1.4rem;
    text-decoration: none;
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: #16181c; }
  .glyph {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 1.1rem;
  }
  .glyph.light {
    background: #ffffff;
    padding: 0.45rem;
  }
  .icon-btn:hover::after,
  .icon-btn:focus-visible::after {
    content: attr(data-label);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 0.35rem);
    transform: translateX(-50%);
    background: #16181c;
    color: #ffffff;
    border: 1px solid #2f3336;
    border-radius: 0.8rem;
    padding: 0.45rem 0.9rem;
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
    z-index: 2;
  }
</style>

<script>
/* Email icon. Google Sites puts this page in a sandboxed iframe
   (allow-popups and allow-popups-to-escape-sandbox, but no top navigation),
   and a mailto: link that tries to navigate the iframe itself is dropped by
   some phone browsers. target="_blank" makes the tap open a new, unsandboxed
   window, which hands mailto: to the phone's mail app. Desktop browsers often
   have no mail app registered for mailto:, so a mouse/trackpad device gets a
   Gmail compose window in a new tab instead. */
(function () {
  var link = document.getElementById("email-link");
  if (!link || !window.matchMedia) return;
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    link.href = "https://mail.google.com/mail/?view=cm&fs=1&to=FanEditFanClub@gmail.com";
    link.rel = "noopener noreferrer";
  }
})();
</script>
