<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Google Sites custom embed. One pill, centered, transparent page.
  Shown only on phones and tablets. The iframe width is not the signal:
  a desktop section can be narrow, and a phone embed can be wide.
  The button stays display:none until the script runs, so a desktop
  load does not flash it. target="_top" leaves the Sites iframe.
-->
<title>Get The Mobile Web App</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: transparent;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: pan-y;
  }

  /* Hidden until the device check adds .is-visible. */
  .get-app {
    display: none;
    height: 46px;
    padding: 0 22px;
    background: #ffffff;
    color: #000000;
    border: 0;
    border-radius: 999px;
    font-weight: 800;
    font-size: 15px;
    line-height: 1;
    letter-spacing: -0.01em;
    text-decoration: none;
    text-align: center;
    white-space: nowrap;
    align-items: center;
    justify-content: center;
  }

  .get-app.is-visible { display: inline-flex; }

  .get-app:hover { opacity: 0.92; }

  .get-app:focus-visible {
    outline: 2px solid #1d9bf0;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<a id="get-app" class="get-app" href="https://faneditfanclub.github.io/fanedit-social-feeds/app/" target="_top">Get The Mobile Web App</a>
<script>
(function () {
  var link = document.getElementById("get-app");
  if (!link) return;
  var coarse = false;
  var noHover = false;
  if (window.matchMedia) {
    coarse = window.matchMedia("(pointer: coarse)").matches;
    noHover = window.matchMedia("(hover: none)").matches;
  }
  var narrow = window.screen && screen.width < 1024;
  if (coarse || noHover || narrow) link.classList.add("is-visible");
})();
</script>
</body>
</html>
