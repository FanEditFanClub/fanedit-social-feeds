<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Kept so the current /x embed URL still loads. Prefer the scroll-safe cards
  embed-x-profile.html and embed-x-list.html (see README) when updating the
  Google Site. This page no longer loads widgets.js or the Facebook, Reddit,
  or PayPal markup that used to be copied in here.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    overflow-x: clip;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e7e9ea;
  }
  .page-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    gap: 20px;
    padding: 4px;
  }
  .widget-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch;
    gap: 16px;
    width: 100%;
  }
  .x-row .rss-container {
    flex: 1 1 0;
    max-width: none;
    min-width: 0;
  }
  .rss-container {
    background: #000000;
    border: 1px solid #2f3336;
    border-radius: 16px;
    padding: 16px;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .rss-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid #2f3336;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .x-profile-pic {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: url("https://i.imgur.com/xGyaOEB.jpeg") center / cover no-repeat;
    border: 1px solid #2f3336;
  }
  .rss-title { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.3px; line-height: 1.25; text-wrap: balance; }
  .rss-sub { font-size: 12px; color: #71767b; font-weight: 600; display: block; margin-top: 2px; text-wrap: pretty; }
  .feed-btn {
    background: #ffffff; color: #000000; text-decoration: none;
    font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .x-feed-scroll {
    max-height: 380px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #2f3336 transparent;
  }
  .x-post {
    border: 1px solid #2f3336;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    background: #000000;
    text-align: left;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    display: block;
  }
  .x-post:last-child { margin-bottom: 0; }
  .x-post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .x-post-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: #16181c center / cover no-repeat;
    border: 1px solid #2f3336;
  }
  .x-post-names { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .x-post-name { color: #fff; font-weight: 700; font-size: 14px; text-wrap: balance; }
  .x-post-date { color: #71767b; font-size: 12.5px; }
  .x-post-body { color: #e7e9ea; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; text-wrap: pretty; }
  .action-btn {
    display: block; width: 100%; text-align: center;
    background: #ffffff; color: #000000; padding: 10px 20px;
    border-radius: 30px; font-weight: 700; font-size: 14px; text-decoration: none;
    text-wrap: balance;
  }
  .x-group-chat-wrap { text-align: center; }
  .x-group-chat-btn {
    display: inline-block; background: #ffffff; color: #000000; font-weight: 700;
    font-size: 15px; padding: 12px 32px; border-radius: 9999px; text-decoration: none;
    text-wrap: balance;
  }
  .note { font-size: 13px; color: #71767b; text-align: center; padding: 12px 0; text-wrap: balance; }
  @media screen and (max-width: 480px) {
    .page-wrap { gap: 16px; padding: 4px 2px; }
    .x-row .rss-container { flex: none; width: 100%; }
  }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="widget-row x-row">
    <div class="rss-container">
      <div class="rss-header">
        <div class="header-left">
          <div class="x-profile-pic"></div>
          <div>
            <h3 class="rss-title">Fan Edit Fan Club</h3>
            <span class="rss-sub">@FanEditFanClub on X</span>
          </div>
        </div>
        <a href="https://x.com/FanEditFanClub" target="_blank" rel="noopener noreferrer" class="feed-btn">Follow</a>
      </div>
      <div class="x-feed-scroll" id="x-feed"><div class="note">Loading posts…</div></div>
      <a href="https://x.com/FanEditFanClub" target="_blank" rel="noopener noreferrer" class="action-btn">View more on X</a>
    </div>
    <div class="rss-container">
      <div class="rss-header">
        <div class="header-left">
          <div class="x-profile-pic"></div>
          <div>
            <h3 class="rss-title">Fan Editors</h3>
            <span class="rss-sub">X List by @FanEditFanClub</span>
          </div>
        </div>
        <a href="https://x.com/i/lists/2072540475530084770" target="_blank" rel="noopener noreferrer" class="feed-btn">Follow</a>
      </div>
      <div class="x-feed-scroll" id="x-list-feed"><div class="note">Loading posts…</div></div>
      <a href="https://x.com/i/lists/2072540475530084770" target="_blank" rel="noopener noreferrer" class="action-btn">View more on X</a>
    </div>
  </div>
  <div class="x-group-chat-wrap">
    <a href="https://x.com/i/chat/group_join/g2084666734565285936/d014sDtior" target="_blank" rel="noopener noreferrer" class="x-group-chat-btn">Open X Group Chat</a>
  </div>
</div>
<script src="embed.js"></script>
<script>
  function renderX(elId, posts, fallback) {
    var el = document.getElementById(elId);
    if (!el) return;
    if (!posts || !posts.length) {
      el.innerHTML = '<div class="note">No posts yet.</div>';
      return;
    }
    el.innerHTML = posts.slice(0, 6).map(function (post) {
      var name = post.author_name || fallback.name;
      var handle = String(post.author_handle || fallback.handle).replace(/^@/, "");
      var avatar = post.author_avatar || fallback.avatar || "";
      var when = FanEmbed.fmt(post.created_at || post.sent_at);
      var style = avatar ? ' style="background-image:url(\'' + FanEmbed.esc(avatar) + '\')"' : "";
      return '<a class="x-post" href="' + FanEmbed.esc(post.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="x-post-header"><div class="x-post-avatar"' + style + '></div>' +
        '<div class="x-post-names"><span class="x-post-name">' + FanEmbed.esc(name) + '</span>' +
        '<span class="x-post-date">@' + FanEmbed.esc(handle) + ' · ' + FanEmbed.esc(when) + '</span></div></div>' +
        '<div class="x-post-body">' + FanEmbed.esc(post.text || "").replace(/\n/g, "<br>") + '</div></a>';
    }).join("");
  }
  FanEmbed.load("x-posts.json").then(function (data) {
    var profile = (data && data.profile) || {};
    renderX("x-feed", data && data.posts, {
      name: profile.name || "Fan Edit Fan Club",
      handle: profile.handle || "FanEditFanClub",
      avatar: profile.picture || ""
    });
  }).catch(function () {
    document.getElementById("x-feed").innerHTML = '<div class="note">Unable to load posts.</div>';
  });
  FanEmbed.load("x-list.json").then(function (data) {
    renderX("x-list-feed", data && data.posts, { name: "Fan Editors", handle: "", avatar: "" });
  }).catch(function () {
    document.getElementById("x-list-feed").innerHTML = '<div class="note">Unable to load posts.</div>';
  });
</script>
</body>
</html>
