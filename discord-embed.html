<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: transparent;
    overflow-x: clip;
  }
  /* Gray merged container: single widget look. max-width + margin center it
     so its edges align exactly with the social feeds block below. The feeds
     page-wrap is 1180px but carries 4px horizontal padding, so its visible
     cards sit at 1172px — the gray box caps at 1172px to match the cards'
     edges exactly (not the wrap's). */
  .discord-merge {
    background: #313338;
    border-radius: 12px;
    padding: 12px;
    width: 100%;
    height: 100%;
    max-width: 1172px;
    margin: 0 auto;
  }
  /* Single container controlling how the two panels relate to each other
     at every breakpoint. Fills the merge wrapper so desktop panels can
     stretch to the full iframe height. */
  .discord-combo {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    width: 100%;
    height: 100%;
  }
  .discord-panel {
    width: 100%;
    max-width: 350px;
    height: 100%;
    flex: 0 1 350px;
    min-width: 0;
  }
  .discord-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .widgetbot-container {
    width: 100%;
    max-width: 800px;
    height: 100%;
    flex: 1 1 500px;
    min-width: 0;
    position: relative;
  }
  /* The <widgetbot> host is display:inline with zero size until its script
     runs — make it a proper block filling the container from first paint,
     so the panel box is stable even before the script executes. */
  widgetbot {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Loading overlay: WidgetBot's chat takes seconds to boot (its iframe
     lives in a shadow root, so nothing renders until then). This covers
     the panel with a Discord-styled spinner instead of a blank box that
     looks "cut off", then fades when the chat iframe reports loaded.
     Desktop and mobile both get it; no layout or functionality changes. */
  .wb-loading {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #2b2d31;
    border-radius: 8px;
    color: #b5bac1;
    font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: opacity 0.4s ease;
  }
  .wb-loading.done {
    opacity: 0;
    pointer-events: none;
  }
  .wb-spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid #1e1f22;
    border-top-color: #5865f2;
    animation: wb-spin 0.9s linear infinite;
  }
  @keyframes wb-spin {
    to { transform: rotate(360deg); }
  }
  /* Below this width, side-by-side gets too cramped for either panel to
     read well — stack them instead of letting them squeeze/overlap.
     NOTE: the desktop `flex` shorthands set a flex-basis, which would
     override `height` on the column axis, so flex is reset here and height
     takes control of the panel size. */
  @media (max-width: 900px) {
    .discord-combo {
      flex-direction: column;
      align-items: center;
      gap: 12px;
      height: auto;
    }
    /* The Sites embed block has one fixed iframe height across viewports
       (set by dragging — now ~1000px). Stacked panels are sized to nearly
       fill it: 8 + 340 + 12 + 600 + 8 = 968px. Both panels show generously
       and you scroll the PAGE between them instead of scrolling inside a
       tiny widget. The merge wrapper goes height:auto so it hugs the
       stacked content exactly. */
    .discord-merge {
      padding: 8px;
      height: auto;
    }
    .discord-panel {
      order: 1;
      flex: none;
      width: 100%;
      max-width: 560px;
      height: 340px;
    }
    .widgetbot-container {
      order: 2;
      flex: none;
      width: 100%;
      max-width: 560px;
      height: 600px;
    }
  }
  /* Mirror the feeds block's phone padding (page-wrap goes to 2px sides
     under 480px) so the gray edges stay flush with the cards there too. */
  @media (max-width: 480px) {
    .discord-merge {
      width: calc(100% - 4px);
    }
  }
  /* Tablet widths (481-1171px): no width cap binds, so the gray spans the
     iframe; the feeds' card row starts 4px in (page-wrap padding), so
     inset the gray to match its left edge exactly. */
  @media (min-width: 481px) and (max-width: 1171px) {
    .discord-merge {
      width: calc(100% - 4px);
      margin: 0 0 0 4px;
    }
  }
  /* The Discord block's section renders ~16px narrower than the feeds
     block's section (both left-aligned). The 1172px cap binds exactly when
     this iframe is >=1172px wide: the gray then centers 8px left of the
     card row, so nudge it right. Below the cap the gray spans the iframe
     and its left edge already lines up — no nudge. */
  @media (min-width: 1172px) {
    .discord-merge {
      transform: translateX(8px);
    }
  }
</style>
</head>
<body>
<div class="discord-merge">
  <div class="discord-combo">
    <div class="discord-panel">
      <iframe
        src="https://discord.com/widget?id=1529915531736383702&theme=dark"
        allowtransparency="true"
        frameborder="0"
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
      </iframe>
    </div>
    <div class="widgetbot-container">
      <div class="wb-loading" id="wb-loading">
        <div class="wb-spinner"></div>
        <div>Loading Discord chat…</div>
      </div>
      <widgetbot
        server="1529915531736383702"
        channel="1529915534466875546"
        width="100%"
        height="100%"
        shard="https://e.widgetbot.io"
      ></widgetbot>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed"></script>
<script>
(function () {
  var overlay = document.getElementById('wb-loading');
  if (!overlay) return;
  var finished = false;
  var finish = function () {
    if (finished) return;
    finished = true;
    overlay.classList.add('done');
    setTimeout(function () { overlay.remove(); }, 500);
  };
  var attach = function () {
    var host = document.querySelector('widgetbot');
    var frame = host && host.shadowRoot && host.shadowRoot.querySelector('iframe');
    if (!frame) return false;
    frame.addEventListener('load', finish);
    return true;
  };
  if (!attach()) {
    /* CDN slow/blocked: poll briefly, then rely on the fallback below
       rather than trapping anyone behind the spinner. */
    var tries = 0;
    var poll = setInterval(function () {
      if (attach() || ++tries > 20) clearInterval(poll);
    }, 500);
  }
  setTimeout(finish, 12000);
})();
</script>
</body>
</html>
