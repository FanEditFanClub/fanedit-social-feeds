<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    background-color: transparent;
    overflow-x: clip;
  }
  /* Gray merged container: single widget look. max-width + margin center it
     so its edges align exactly with the social feeds block below. The feeds
     page-wrap is 1180px but carries 4px horizontal padding, so its visible
     cards sit at 1172px — the gray box caps at 1172px to match the cards'
     edges exactly (not the wrap's). */
  .discord-merge {
    background: #313338;
    border-radius: 12px;
    padding: 12px;
    width: 100%;
    max-width: 1172px;
    margin: 0 auto;
  }
  /* Single container controlling how the two panels relate to each other
     at every breakpoint. */
  .discord-combo {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    width: 100%;
  }
  .discord-panel {
    width: 100%;
    max-width: 350px;
    height: 600px;
    flex: 0 1 350px;
    min-width: 0;
  }
  .discord-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .widgetbot-container {
    width: 100%;
    max-width: 800px;
    height: 600px;
    flex: 1 1 500px;
    min-width: 0;
  }
  /* Below this width, side-by-side gets too cramped for either panel to
     read well — stack them instead of letting them squeeze/overlap. */
  @media (max-width: 900px) {
    .discord-combo {
      flex-direction: column;
      align-items: center;
    }
    .discord-panel {
      order: 1;
    }
    .widgetbot-container {
      order: 2;
    }
    .discord-panel,
    .widgetbot-container {
      max-width: 500px;
    }
  }
  @media (max-width: 600px) {
    .widgetbot-container {
      height: 450px; /* Reduces height so it fits better on phone screens */
    }
    .discord-panel {
      height: 420px;
    }
  }
  /* Mirror the feeds block's phone padding (page-wrap goes to 2px sides
     under 480px) so the gray edges stay flush with the cards there too. */
  @media (max-width: 480px) {
    .discord-merge {
      width: calc(100% - 4px);
    }
  }
  /* The Discord block's section renders ~16px narrower than the feeds
     block's section (both left-aligned). The 1172px cap binds exactly when
     this iframe is >=1172px wide: the gray then centers 8px left of the
     card row, so nudge it right. Below the cap the gray spans the iframe
     and its left edge already lines up — no nudge. */
  @media (min-width: 1172px) {
    .discord-merge {
      transform: translateX(8px);
    }
  }
</style>
</head>
<body>
<div class="discord-merge">
  <div class="discord-combo">
    <div class="discord-panel">
      <iframe
        src="https://discord.com/widget?id=1529915531736383702&theme=dark"
        allowtransparency="true"
        frameborder="0"
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
      </iframe>
    </div>
    <div class="widgetbot-container">
      <widgetbot
        server="1529915531736383702"
        channel="1529915534466875546"
        width="100%"
        height="100%"
        shard="https://e.widgetbot.io"
      ></widgetbot>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed"></script>
</body>
</html>
