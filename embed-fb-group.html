<!DOCTYPE html>
<html lang="en" data-ratio="5/4" style="--ratio: 0.8">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Google Sites embed box ratio: width:height = 5:4 (height = 0.8 × width).
  SociableKit's group feed scrolls, so this card is the group name, cover,
  and a join button. A shorter box scales down; a taller box leaves space.
-->
<link rel="stylesheet" href="embed.css">
<title>Fan Edit Fan Club Facebook Group</title>
<style>
  .join {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2.2rem;
  }
  .join-cover {
    width: 26rem;
    height: 26rem;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #2f3336;
    flex: 0 0 auto;
    background: #16181c;
  }
  .join-copy {
    color: #e7e9ea;
    font-size: 3.05rem;
    font-weight: 400;
    line-height: 1.35;
    text-wrap: pretty;
    max-width: 78rem;
  }
  .join .more { width: 100%; }
</style>
</head>
<body>
<article class="card join">
  <img class="join-cover" src="https://i.imgur.com/xGyaOEB.jpeg" alt="">
  <div class="brand-text">
    <h1>Fan Edit Fan Club</h1>
    <p class="sub">Facebook Group</p>
  </div>
  <p class="join-copy">We're a Community for Fans &amp; Editors Dedicated to The Art of The Fan Edit.</p>
  <a class="more pill blue" href="https://www.facebook.com/groups/faneditfanclub" target="_blank">Join the Facebook Group</a>
</article>
</body>
</html>
