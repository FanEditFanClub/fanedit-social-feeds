name: social-feeds

# Refreshes the public JSON feeds behind the club website widgets.
# Also refreshes site-pages.json for the installable app (fetch.py).
# Served via GitHub Pages; widgets fetch the JSON directly (no CORS issues).
# Keep this file name. A Google Apps Script dispatches it every 15 minutes.
#
# x-list.json and x-posts.json come from X's public syndication pages.
# That host allows about 30 requests / 15 minutes per IP. GitHub-hosted
# runners share IPs, so a run can get HTTP 429. fetch.py backs off once
# (and waits if the limit resets within a minute). On failure it leaves
# the last good JSON in place rather than blanking the feed.

on:
  workflow_dispatch: {}

# The Apps Script is the only scheduler. Queue a second dispatch until the
# first finishes so two runs do not push main at the same time.
concurrency:
  group: social-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python fetch.py
      - name: Commit updates
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "refresh feeds"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Push rejected (attempt ${attempt}/3); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "Push failed after 3 attempts"
          exit 1
