name: social-feeds

# Refreshes the public JSON feeds behind the club website widgets.
# Served via GitHub Pages; widgets fetch the JSON directly (no CORS issues).
#
# x-list.json and x-posts.json come from X's public syndication pages.
# That host allows about 30 requests / 15 minutes per IP. GitHub-hosted
# runners share IPs, so a run can get HTTP 429. fetch.py backs off once
# (and waits if the limit resets within a minute). On failure it leaves
# the last good JSON in place rather than blanking the feed.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python fetch.py
      - name: Commit updates
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refresh feeds"
          git push
