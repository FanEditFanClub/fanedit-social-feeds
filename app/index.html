<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="A community for fans and editors, dedicated to the art of the fan edit.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fan Edit Fan Club">
<title>Fan Edit Fan Club</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#home">
    <img src="icons/icon-192.png" alt="" width="44" height="44">
    <span class="brand-name">Fan Edit Fan Club</span>
  </a>
  <div class="install-slot">
    <button type="button" id="install-btn" hidden>Install app</button>
    <p id="install-tip" class="install-tip" hidden></p>
  </div>
</header>
<p id="ios-hint" class="hint" hidden>
  <span>On iPhone, tap Share, then Add to Home&nbsp;Screen.</span>
  <button type="button" id="ios-dismiss">Dismiss</button>
</p>
<main id="main"></main>
<nav id="tabs" class="tabs" aria-label="Club pages"></nav>
<script src="../embed.js"></script>
<script src="app.js"></script>
</body>
</html>
